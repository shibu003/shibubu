[package]
name = "poc-webview"
version = "0.0.0"
edition = "2021"
publish = false
description = "v0.13 M4 の実測 PoC: eframe 0.31 の窓の中に WKWebView（wry）を child で置けるか"

# 独立した package。root の workspace に入れない（空の [workspace] で親の Cargo.toml を探しに行かせない）
[workspace]

[dependencies]
eframe = { version = "0.31", default-features = true } # 本体（root の Cargo.toml）と同じ: glow・winit 0.30・accesskit
wry = "0.57"                                           # macOS は WKWebView。raw-window-handle 0.6 で eframe と噛み合う
winit = "0.30"                                         # 項目 1 の単独の窓だけ。eframe が使う版と同じ
objc2 = "0.6"                                          # first responder の読み出し（wry と同じ版）
raw-window-handle = "0.6"

# PoC の target は disk を食わない形で（この Mac は空きが少ない）
[profile.dev]
debug = 0
incremental = false
