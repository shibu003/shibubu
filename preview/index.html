<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Kangae — Agent-native App Builder Preview</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="app" class="shell">
  <header class="topbar">
    <div class="brand" role="button" tabindex="0" id="brand"><span class="brand-mark">k</span><span>Kangae</span></div>
    <div class="breadcrumbs"><span class="crumb-dot"></span><span id="crumb">Home</span></div>
    <div class="top-actions"><button class="search-btn" id="command" title="アプリを作成 (Ctrl/⌘ + K)"><span class="magnify"></span><span class="search-label">作りたいことを入力</span><kbd>⌘ K</kbd></button><button id="agent-toggle" class="button secondary agent-trigger" aria-controls="agent-rail" aria-expanded="true">✦ <span>提案</span> <span id="proposal-count" class="count" hidden></span></button><button id="settings" class="icon-button" aria-label="設定">•••</button></div>
  </header>
  <aside class="sidebar" id="sidebar"><button id="new-app" class="create-btn">＋ <span>新しいアプリ</span></button><nav aria-label="メインナビゲーション"><div class="nav-label">WORKSPACE</div><button class="nav-item selected" id="nav-home"><span class="nav-icon">⌂</span> ホーム</button><button class="nav-item" id="nav-apps"><span class="nav-icon">▦</span> アプリ <span id="app-count" class="nav-count">0</span></button><button class="nav-item" id="nav-runs"><span class="nav-icon">↳</span> 実行履歴</button><button class="nav-item" id="nav-connections"><span class="nav-icon">⌁</span> 接続</button></nav><div class="side-separator"></div><div class="nav-label">YOUR APPS</div><div id="side-apps" class="side-apps"></div><div class="sidebar-footer"><div class="status-dot"></div><span>Local preview</span><span class="footer-version">v0.12</span></div></aside>
  <main id="main" class="main" tabindex="-1"></main>
  <aside id="agent-rail" class="agent-rail"><div class="agent-head"><div><h2>Agent</h2><p>あなたの目的に合う次の一手</p></div><button id="agent-close" class="icon-button" aria-label="提案を閉じる">×</button></div><div class="agent-tabs" role="tablist" aria-label="Agentビュー"><button class="agent-tab active" data-tab="suggestions" role="tab">提案</button><button class="agent-tab" data-tab="details" role="tab">アプリの状態</button><button class="agent-tab" data-tab="history" role="tab">履歴</button></div><div id="agent-content" class="agent-content"></div><div class="agent-compose"><label for="agent-command">このアプリをどう変えますか？</label><div class="agent-command-row"><input id="agent-command" placeholder="例: 検索を追加して" autocomplete="off"><button id="agent-send" aria-label="変更を依頼">↑</button></div><div class="agent-footnote">デモの提案はローカルルール生成 · 外部送信なし</div></div></aside>
</div><div class="mobile-mask" id="mobile-mask" hidden></div><div id="dialog-root"></div><div id="toast" aria-live="polite" role="status"></div><script src="app.js" defer></script></body></html>
